name: Build
on:
  workflow_dispatch:
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "stage 1 ok"
  patch:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "stage 2 ok"
  gn:
    needs: patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "stage 3 ok"
  compile:
    needs: gn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "stage 4 ok"
  package:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "stage 5 ok"
  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "stage 6 ok"
